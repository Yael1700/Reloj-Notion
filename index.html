<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RELOJ Clock Notion</title>

<style>
/* ====================================
   MAGIA PARA NOTION (ESCALADO PERFECTO)
   ==================================== */
:root {
    /* Esto obliga a que toda medida 'rem' en el código dependa del 
       tamaño del bloque de Notion, manteniendo la proporción 4:3 intacta */
    font-size: min(1vw, calc(100vh / 75));

    /* Imagen por defecto */
    --bg-image:url("./Olivia_YSPSFAGSIL.png");
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: "Segoe UI", Inter, Arial, Helvetica, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Fondos */
body.solid { background: #86A8E7; }
body.gradient { background: linear-gradient(135deg, #5d7ec9 0%, #8fb2ee 100%); }
body.image {
    background-image: var(--bg-image);
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
}

/* ====================================
   CANVAS PRINCIPAL
   ==================================== */

.canvas{
    /* En lugar de %, usamos nuestra medida relativa. 
       90rem = 90% del espacio disponible seguro en Notion */
    width: 90rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

/* ====================================
   RELOJ
   ==================================== */

.clock{
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 2.5rem; /* Separación proporcional */
}

.card{
    flex: 1;
    aspect-ratio: 1.15 / 1;
    position: relative;
    overflow: hidden;
    border-radius: 2.5rem; 

    /* Cristal translúcido */
    background: rgba(120,150,255,0.08);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.20);
    box-shadow:
        0 1.5rem 3rem rgba(0,0,0,0.18),
        inset 0 1px 0 rgba(255,255,255,0.25);
}

/* Reflejo superior */
.card::before{
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,0.20),
            rgba(255,255,255,0.05) 45%,
            transparent
        );
    pointer-events: none;
}

/* Línea central */
.card::after{
    content: "";
    position: absolute;
    left: 0; right: 0;
    top: 50%;
    height: 1px;
    background: rgba(25,35,65,0.22);
    box-shadow: 0 1px 0 rgba(255,255,255,0.13);
}

/* ====================================
   VALORES Y TEXTOS
   ==================================== */

.value{
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #F8F4E9;
    font-weight: 700;
    line-height: 1;
    
    /* Tamaños basados en nuestro cálculo maestro */
    letter-spacing: -0.5rem;
    text-shadow: 0 0.5rem 1rem rgba(0,0,0,0.12);
    font-size: 16rem; 
}

.ampm{
    position: absolute;
    top: 1.8rem;
    left: 2rem;
    z-index: 10;
    color: rgba(255,255,255,0.60);
    font-weight: 700;
    letter-spacing: 0.1rem;
    font-size: 2rem;
}

.date{
    margin-top: 4rem;
    color: rgba(255,255,255,0.90);
    font-weight: 600;
    text-align: center;
    text-shadow: 0 0.2rem 0.5rem rgba(0,0,0,0.15);
    font-size: 2.8rem;
}

</style>
</head>

<body class="image">

<div class="canvas">
    <div class="clock">
        <div class="card">
            <div class="ampm" id="ampm">AM</div>
            <div class="value" id="hours">11</div>
        </div>
        <div class="card">
            <div class="value" id="minutes">46</div>
        </div>
        <div class="card">
            <div class="value" id="seconds">20</div>
        </div>
    </div>
    <div class="date" id="date">
        cargando...
    </div>
</div>

<script>
function updateClock(){
    const now = new Date();

    const hours24 = now.getHours();
    const minutes = now.getMinutes();
    const seconds = now.getSeconds();

    const ampm = hours24 >= 12 ? "PM" : "AM";
    let hours12 = hours24 % 12;

    if(hours12 === 0){
        hours12 = 12;
    }

    document.getElementById("hours").textContent = String(hours12).padStart(2,"0");
    document.getElementById("minutes").textContent = String(minutes).padStart(2,"0");
    document.getElementById("seconds").textContent = String(seconds).padStart(2,"0");
    document.getElementById("ampm").textContent = ampm;

    const formattedDate = now.toLocaleDateString(
        "es-ES",
        {
            weekday:"long",
            day:"numeric",
            month:"long",
            year:"numeric"
        }
    );

    document.getElementById("date").textContent = formattedDate;
}

updateClock();
setInterval(updateClock, 1000);
</script>

</body>
</html>
