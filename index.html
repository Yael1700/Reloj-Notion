<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RELOJ Clock Notion Fijo</title>

<style>
/* ====================================
   RESET
   ==================================== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg-image: url("./Olivia_YSPSFAGSIL.png");
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden; /* Evita cualquier barra de scroll en Notion */
    font-family: "Segoe UI", Inter, Arial, Helvetica, sans-serif;
}

/* ====================================
   TRUCO MAESTRO PARA NOTION
   ==================================== */
.widget-container {
    /* Al usar absolute e inset 0, ignoramos los errores de Notion 
       y tomamos el 100% exacto del marco real */
    position: absolute;
    inset: 0;
    
    /* Le decimos a CSS que este contenedor es nuestra nueva "pantalla" */
    container-type: size; 
    
    display: flex;
    justify-content: center;
    align-items: center;
    
    /* El fondo ahora va aquí */
    background-image: var(--bg-image);
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
}

/* ====================================
   CANVAS 4:3
   ==================================== */
.canvas {
    /* 
      Esto asegura que siempre mantenga la proporción 4:3. 
      Si Notion es muy ancho, se limita por el alto (cqh). 
      Si Notion es muy alto, se limita por el ancho (cqw).
    */
    width: min(90cqw, calc(90cqh * 4 / 3));
    aspect-ratio: 4 / 3;
    
    /* Convertimos el canvas en la regla de medir interna */
    container-type: inline-size;
    
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

/* ====================================
   RELOJ
   ==================================== */
.clock {
    width: 95%;
    display: flex;
    justify-content: space-between;
    gap: 3cqi; /* Separación basada estrictamente en el ancho del canvas */
}

.card {
    flex: 1; /* Las 3 tarjetas miden exactamente lo mismo */
    aspect-ratio: 1.15 / 1;
    position: relative;
    overflow: hidden;
    
    /* Bordes y sombras proporcionales */
    border-radius: 3cqi; 
    
    background: rgba(120, 150, 255, 0.08);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.20);
    box-shadow:
        0 1cqi 2.5cqi rgba(0, 0, 0, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);
}

/* Reflejo superior */
.card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.20),
        rgba(255, 255, 255, 0.05) 45%,
        transparent
    );
    pointer-events: none;
}

/* Línea central */
.card::after {
    content: "";
    position: absolute;
    left: 0; right: 0; top: 50%;
    height: 1px;
    background: rgba(25, 35, 65, 0.22);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.13);
}

/* ====================================
   VALORES (TEXTO)
   ==================================== */
.value {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #F8F4E9;
    font-weight: 700;
    line-height: 1;
    
    /* Esto evita que colapse. cqi = % del ancho del canvas */
    letter-spacing: -0.5cqi;
    text-shadow: 0 0.5cqi 1cqi rgba(0, 0, 0, 0.12);
    font-size: 17cqi; 
}

.ampm {
    position: absolute;
    top: 2cqi;
    left: 2cqi;
    z-index: 10;
    color: rgba(255, 255, 255, 0.60);
    font-weight: 700;
    letter-spacing: 0.1cqi;
    font-size: 2.2cqi;
}

.date {
    margin-top: 4cqi;
    color: rgba(255, 255, 255, 0.90);
    font-weight: 600;
    text-align: center;
    text-shadow: 0 0.2cqi 0.5cqi rgba(0, 0, 0, 0.15);
    font-size: 3cqi;
}

</style>
</head>
<body>

<!-- El nuevo contenedor envolvente -->
<div class="widget-container">
    <div class="canvas">
        <div class="clock">
            <div class="card">
                <div class="ampm" id="ampm">AM</div>
                <div class="value" id="hours">11</div>
            </div>
            <div class="card">
                <div class="value" id="minutes">46</div>
            </div>
            <div class="card">
                <div class="value" id="seconds">20</div>
            </div>
        </div>
        <div class="date" id="date">
            cargando...
        </div>
    </div>
</div>

<script>
function updateClock(){
    const now = new Date();

    const hours24 = now.getHours();
    const minutes = now.getMinutes();
    const seconds = now.getSeconds();

    const ampm = hours24 >= 12 ? "PM" : "AM";
    let hours12 = hours24 % 12;

    if(hours12 === 0){
        hours12 = 12;
    }

    document.getElementById("hours").textContent = String(hours12).padStart(2,"0");
    document.getElementById("minutes").textContent = String(minutes).padStart(2,"0");
    document.getElementById("seconds").textContent = String(seconds).padStart(2,"0");
    document.getElementById("ampm").textContent = ampm;

    const formattedDate = now.toLocaleDateString(
        "es-ES",
        {
            weekday:"long",
            day:"numeric",
            month:"long",
            year:"numeric"
        }
    );

    document.getElementById("date").textContent = formattedDate;
}

updateClock();
setInterval(updateClock, 1000);
</script>

</body>
</html>
