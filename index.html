<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RELOJ Clock</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:
        "Segoe UI",
        Inter,
        Arial,
        Helvetica,
        sans-serif;
}

/* ====================================
   CONFIGURACIÓN DEL FONDO
   ==================================== */

/*
    OPCIONES:

    class="solid"
    class="gradient"
    class="image"
*/

:root{

    /* Color sólido */
  /*  --solid-color:#86A8E7;

    /* Degradado */
   /* --gradient:
        linear-gradient(
            135deg,
            #5d7ec9 0%,
            #8fb2ee 100%
        );

    /* Imagen */
    --bg-image:url("./Olivia\ YSPSFAGSIL.png");
}

/* ====================================
   BODY
   ==================================== */

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Color sólido */

body.solid{
    background:var(--solid-color);
}

/* Degradado */

body.gradient{
    background:var(--gradient);
}

/* Imagen */

body.image{
    background-image:var(--bg-image);
    background-position:center;
    background-size:cover;
    background-repeat:no-repeat;
}

/* ====================================
   CANVAS 4:3
   ==================================== */

.canvas{

    width:min(
        95vw,
        calc(95vh * 4 / 3)
    );

    aspect-ratio:4/3;

    position:relative;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;
}

/* ====================================
   RELOJ
   ==================================== */

.clock{

    width:95%;

    display:flex;

    justify-content:center;

    gap:18px;
}

.card{

    flex:1;

    aspect-ratio:1.15/1;

    position:relative;

    overflow:hidden;

    border-radius:22px;

    /* Cristal translúcido */

    background:
        rgba(120,150,255,0.08);

    backdrop-filter:
        blur(24px)
        saturate(180%);

    -webkit-backdrop-filter:
        blur(24px)
        saturate(180%);

    border:
        1px solid
        rgba(255,255,255,0.20);

    box-shadow:
        0 10px 25px rgba(0,0,0,0.18),
        inset 0 1px 0 rgba(255,255,255,0.25);
}

/* Reflejo superior */

.card::before{

    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,0.20),
            rgba(255,255,255,0.05) 45%,
            transparent
        );

    pointer-events:none;
}

/* Línea central */

.card::after{

    content:"";

    position:absolute;

    left:0;
    right:0;

    top:50%;

    height:1px;

    background:
        rgba(25,35,65,0.22);

    box-shadow:
        0 1px 0 rgba(255,255,255,0.13);
}

/* ====================================
   VALORES
   ==================================== */

.value{

    position:absolute;

    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#F8F4E9;

    font-weight:700;

    line-height:1;

    letter-spacing:-5px;

    text-shadow:
        0 2px 8px rgba(0,0,0,0.12);

    font-size:
        clamp(
            5rem,
            11vw,
            9rem
        );
}

/* ====================================
   AM / PM
   ==================================== */

.ampm{

    position:absolute;

    top:14px;
    left:15px;

    z-index:10;

    color:
        rgba(255,255,255,0.60);

    font-weight:700;

    letter-spacing:1px;

    font-size:
        clamp(
            0.9rem,
            1.6vw,
            1.7rem
        );
}

/* ====================================
   FECHA
   ==================================== */

.date{

    margin-top:32px;

    color:
        rgba(255,255,255,0.90);

    font-weight:600;

    text-align:center;

    text-shadow:
        0 2px 5px rgba(0,0,0,0.15);

    font-size:
        clamp(
            1rem,
            2vw,
            2rem
        );
}

/* ====================================
   RESPONSIVE
   ==================================== */

@media (max-width:900px){

    .clock{
        gap:10px;
    }

    .card{
        border-radius:16px;
    }

    .date{
        margin-top:20px;
    }
}

</style>
</head>

<!--
    CAMBIAR ENTRE:

    class="solid"
    class="gradient"
    class="image"
-->

<body class="image">

<div class="canvas">

    <div class="clock">

        <div class="card">
            <div class="ampm" id="ampm">AM</div>
            <div class="value" id="hours">11</div>
        </div>

        <div class="card">
            <div class="value" id="minutes">46</div>
        </div>

        <div class="card">
            <div class="value" id="seconds">20</div>
        </div>

    </div>

    <div class="date" id="date">
        viernes, 6 de noviembre de 2026
    </div>

</div>

<script>

function updateClock(){

    const now = new Date();

    const hours24 = now.getHours();
    const minutes = now.getMinutes();
    const seconds = now.getSeconds();

    const ampm =
        hours24 >= 12
        ? "PM"
        : "AM";

    let hours12 =
        hours24 % 12;

    if(hours12 === 0){
        hours12 = 12;
    }

    document.getElementById("hours").textContent =
        String(hours12).padStart(2,"0");

    document.getElementById("minutes").textContent =
        String(minutes).padStart(2,"0");

    document.getElementById("seconds").textContent =
        String(seconds).padStart(2,"0");

    document.getElementById("ampm").textContent =
        ampm;

    const formattedDate =
        now.toLocaleDateString(
            "es-ES",
            {
                weekday:"long",
                day:"numeric",
                month:"long",
                year:"numeric"
            }
        );

    document.getElementById("date").textContent =
        formattedDate;
}

updateClock();

setInterval(
    updateClock,
    1000
);

</script>

</body>
</html>
